<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sérénité</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5c8a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{color-scheme:light;--bg:#f3f6f9;--surface:#fff;--ink:#1b2a38;--muted:#566877;--accent:#0f5c8a;--accent-ink:#fff;--fun:#2a7fb8;--ok:#1f7a4d;--warn:#b3261e;--line:#d6dfe7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1b26;--surface:#172635;--ink:#eaf1f6;--muted:#a3b4c2;--accent:#6fb7e8;--accent-ink:#0b2233;--fun:#4a9bd0;--ok:#5fd09a;--warn:#ff8f86;--line:#2a4054}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1b26;--surface:#172635;--ink:#eaf1f6;--muted:#a3b4c2;--accent:#6fb7e8;--accent-ink:#0b2233;--fun:#4a9bd0;--ok:#5fd09a;--warn:#ff8f86;--line:#2a4054}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;padding:20px 16px 120px}
header{margin-bottom:18px}
header .date{font-size:1.5rem;font-weight:700;text-transform:capitalize}
header .clock{font-size:3rem;font-weight:700;line-height:1.1;color:var(--accent)}
h2{font-size:1.4rem;margin:8px 0 14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.card.done{opacity:.65}
.time{font-size:1.8rem;font-weight:700;color:var(--accent);min-width:90px}
.grow{flex:1;min-width:140px}
.name{font-size:1.3rem;font-weight:700}
.late{color:var(--warn);font-weight:700}
.ok{color:var(--ok);font-weight:700;font-size:1.3rem}
.empty{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid transparent;min-height:60px;padding:10px 20px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.big{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.2rem}
.wide{width:100%}
.ghost{background:transparent;border-color:var(--line);color:var(--ink);width:100%;margin-top:10px}
.link{background:none;color:var(--muted);text-decoration:underline;min-height:44px;padding:4px 8px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px}
label{display:block;font-weight:700;margin-bottom:14px}
input{display:block;width:100%;margin-top:6px;font:inherit;min-height:60px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.err{color:var(--warn);font-weight:700;min-height:1.4em;margin-bottom:8px}
.week{display:flex;gap:6px;margin-bottom:10px}
.dy,.dtg{flex:1;min-width:0;min-height:64px;padding:4px 2px;font-size:1rem;line-height:1.2;font-weight:700;background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.dy b{display:block;font-size:1.3rem}
.dy.today{border-color:var(--accent)}
.dy[aria-current="true"],.dtg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wk2{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.wk2 button{flex:1 1 140px;min-height:52px;font-size:1rem;background:transparent;border-color:var(--line);color:var(--ink)}
.sub{color:var(--muted)}
.miss{color:var(--warn);font-weight:700}
.lbl{font-weight:700;margin-bottom:8px}
nav{gap:6px}
nav button{padding:10px 2px;font-size:.8rem}
.sos{display:block;width:100%;text-align:center;text-decoration:none;background:var(--warn);color:var(--bg);font-weight:700;font-size:1.5rem;padding:18px;border-radius:14px;margin-bottom:12px}
.sos small{display:block;font-size:1rem;font-weight:400}
.call{display:inline-block;text-decoration:none;text-align:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.2rem;padding:16px 22px;border-radius:14px}
select{display:block;width:100%;margin-top:6px;font:inherit;min-height:60px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
#viewer{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#viewer img{flex:1;min-height:0;max-width:100%;object-fit:contain}
#viewer button{width:100%;max-width:420px;min-height:70px}
header{background:linear-gradient(135deg,var(--accent),var(--fun));color:var(--accent-ink);border-radius:26px;padding:16px 20px;box-shadow:0 5px 0 var(--line)}
header .clock,header .date{color:inherit}
header .hi{font-size:1.1rem}
h2{font-size:1.5rem}
.card,.panel{border-radius:22px;box-shadow:0 4px 0 var(--line)}
.time{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:2px 14px;min-width:0;font-size:1.6rem}
.big,.sos{border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.call{box-shadow:0 4px 0 rgba(0,0,0,.28)}
.big:active,.call:active,.sos:active{transform:translateY(3px);box-shadow:none}
nav{border-radius:26px 26px 0 0;border-top:0;box-shadow:0 -4px 14px rgba(0,0,0,.15)}
nav button{line-height:1.2;border-radius:16px}
nav button span{display:block;font-size:1.5rem;line-height:1.1}
nav button[aria-current="page"],.dy[aria-current="true"]{background:linear-gradient(135deg,var(--accent),var(--fun));border-color:transparent}
.dy{border-radius:14px}
.dy.today:not([aria-current="true"]){border-color:var(--fun)}
.code{font-family:monospace;font-size:1.2rem;font-weight:700;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:12px;margin:10px 0 14px;word-break:break-all;user-select:all}
.fam{margin-top:28px}
.offer{background:linear-gradient(135deg,var(--accent),var(--fun));color:var(--accent-ink);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 var(--line)}
.offer .ot{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.offer .big{background:var(--accent-ink);color:var(--accent);margin-top:12px}
.offer .big:disabled{opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(18deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-ink)}70%,100%{box-shadow:0 0 0 18px transparent}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-260px) scale(1.2) rotate(40deg)}}
#view.anim>*{animation:rise .45s ease both}
#view.anim>*:nth-child(2){animation-delay:.06s}
#view.anim>*:nth-child(3){animation-delay:.12s}
#view.anim>*:nth-child(4){animation-delay:.18s}
#view.anim>*:nth-child(5){animation-delay:.24s}
#view.anim>*:nth-child(n+6){animation-delay:.3s}
.ok.pop{display:inline-block;animation:pop .5s ease both}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease .6s 2}
.quote{animation:rise .6s ease .15s both}
#alarm:not([hidden]){animation:rise .3s ease both}
#alarm .yes{animation:pulse 1.6s ease-out infinite}
nav button{transition:transform .12s,background .2s}
nav button:active,.dy:active{transform:scale(.93)}
nav button[aria-current="page"] span{animation:pop .4s ease}
.cf{position:fixed;top:55vh;font-size:1.6rem;pointer-events:none;z-index:60;animation:fly 1.4s ease-out forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cf{display:none}}
.quote{margin:16px 2px 4px;padding:14px 16px;background:var(--surface);border:2px dashed var(--fun);border-radius:18px;font-style:italic;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--line)}
nav button{flex:1;background:var(--bg);color:var(--ink);border-color:var(--line);font-weight:700}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#alarm{position:fixed;inset:0;z-index:50;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:14px}
#alarm .t{font-size:1.6rem}
#alarm .n{font-size:2.4rem;font-weight:700;line-height:1.15}
#alarm button{width:100%;max-width:420px;font-size:1.4rem;font-weight:700;min-height:76px}
#alarm .yes{background:var(--accent-ink);color:var(--accent)}
#alarm .later{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)}

/* style professionnel */
header{background:var(--accent);color:var(--accent-ink);border-radius:16px;box-shadow:none;padding:18px 20px}
header .hi{font-size:1rem;font-weight:400;opacity:.9}
header .date{font-size:1.25rem}
header .clock{font-size:2.6rem}
.quote{background:transparent;border:0;border-left:4px solid var(--accent);border-radius:0;font-style:normal;font-weight:400;color:var(--muted);padding:6px 14px;margin:16px 2px 8px}
h2{font-size:1.35rem;letter-spacing:.2px}
.card,.panel{border-radius:14px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,40,60,.08),0 2px 8px rgba(15,40,60,.05)}
.time{background:transparent;color:var(--accent);padding:0;border-radius:0;font-size:1.6rem;min-width:84px}
.big,.call,.sos,.ghost{border-radius:12px;box-shadow:none}
.big{font-size:1.1rem}
.big:active,.call:active,.sos:active{transform:scale(.98)}
.offer{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;box-shadow:0 1px 2px rgba(15,40,60,.08)}
.offer .ot{color:var(--accent)}
.offer .big{background:var(--accent);color:var(--accent-ink)}
nav{border-radius:0;border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(15,40,60,.08)}
nav button{border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.dy{border-radius:12px;border-width:1px}
.dy[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dy.today:not([aria-current="true"]){border-color:var(--accent);border-width:2px}
.wk2 button{border-radius:12px}
input,select,textarea{border-radius:10px;border-width:1px}

/* style raffiné */
body{max-width:640px;margin:0 auto}
h2,header .date,header .clock,.offer .ot,.quote{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600}
header{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,40,60,.06)}
header .hi{grid-column:1;color:var(--muted);font-size:1rem;opacity:1}
header .date{grid-column:1;font-size:1.35rem;color:var(--ink)}
header .clock{grid-column:2;grid-row:1/3;font-size:2.4rem;color:var(--accent);font-variant-numeric:tabular-nums}
.quote{font-style:italic;font-weight:400;font-size:1.05rem}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.prog .pt{margin-bottom:8px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s ease}
.time{font-variant-numeric:tabular-nums}
.card:has(.ok){border-left:4px solid var(--ok)}
.card:has(.late),.card:has(.miss){border-left:4px solid var(--warn)}
nav button{font-size:.78rem;letter-spacing:.2px}
nav button span{display:flex;justify-content:center;margin-bottom:3px}
nav button span svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);border-color:transparent}

/* finitions */
body{font-size:1.25rem}
header{grid-template-columns:1fr auto auto}
.aa{grid-column:3;grid-row:1/3;min-height:44px;padding:4px 12px;font-size:.95rem;font-weight:700;background:transparent;border:1px solid var(--line);color:var(--accent);border-radius:10px;margin-left:10px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto;border:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(10,25,40,.25);animation:sheetup .3s ease both}
#view:has(.sheet)::after{content:"";position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:25}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.emptybox{text-align:center;color:var(--muted);padding:18px 8px 24px}
.emptybox svg{width:64px;height:64px;fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.5;margin-bottom:8px}

/* couleurs au choix */
.tools{grid-column:3;grid-row:1/3;display:flex;gap:6px;align-items:center;margin-left:10px}
.tools .aa{margin-left:0}
.dot{display:block;width:20px;height:20px;border-radius:50%;background:var(--accent)}

/* nom de l'application */
.brand{grid-column:1;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1rem;letter-spacing:.4px;color:var(--accent)}
header .clock,.tools{grid-row:1/4}
.ql{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-style:normal;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);margin-bottom:2px}
.pill{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:8px;vertical-align:-2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.pill.cap{width:28px;height:13px;border-radius:7px;transform:rotate(-35deg);margin-right:10px}
.swatch{min-height:48px}
.swatch .pill{margin:0;width:26px;height:26px}
.alertbox{background:var(--surface);border:1px solid var(--warn);border-left:4px solid var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.help{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.help summary{font-weight:700;color:var(--accent);cursor:pointer;min-height:44px;display:flex;align-items:center}
.help ol,.help ul{padding-left:22px;margin:8px 0}
.help li{margin-bottom:6px}
.hrow{margin-bottom:10px}
.okdone{background:var(--surface);border:1px solid var(--ok);border-left:4px solid var(--ok);border-radius:14px;padding:12px 14px;margin-bottom:14px;color:var(--ok);font-weight:700}
.okset{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.offer .ol{margin:8px 0 8px;padding-left:20px}.offer .ol li{margin-bottom:4px}.offer .ofree{color:var(--muted)}
.hrow{margin-bottom:10px}
textarea{display:block;width:100%;margin-top:6px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:84px}
.hhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hname{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.45rem;line-height:1.2}
.blood{min-width:64px;height:64px;border-radius:50%;background:var(--warn);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem}
.hal{margin:0 0 12px}
.hlab{font-weight:700;color:var(--accent);margin-bottom:4px}
.hal .hlab{color:var(--warn)}
.hnone{margin-bottom:12px}
.hsec{border-top:1px solid var(--line);padding:12px 0}
.hc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0}
.tl{margin:4px 0;padding-left:20px}
.tl li{margin-bottom:6px}
.hprog{border-top:1px solid var(--line);padding:12px 0 6px}
.hprog .bar{margin-top:6px;margin-bottom:12px}
#hfull{position:fixed;inset:0;z-index:45;background:var(--surface);color:var(--ink);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));font-size:1.15rem;max-width:640px;margin:0 auto}
#hfull .big{margin-top:16px}
.hfname{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:2rem;line-height:1.15}
.hfsub{color:var(--muted);margin:2px 0 12px}
.hfblood{font-size:1.5rem;margin-bottom:14px}
.hfblood b{color:var(--warn);font-size:1.9rem}
.hfal{border:3px solid var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:1.4rem;font-weight:700}
.hfblk{border-top:1px solid var(--line);padding:12px 0}
</style>
</head>
<body>
<header>
  <div class="brand">Sérénité</div>
  <div class="hi" id="hi">Bonjour</div>
  <div class="date" id="date"></div>
  <div class="clock" id="clock"></div>
  <div class="tools"><button class="aa" onclick="textSize()" aria-label="Changer la taille du texte">Aa</button><button class="aa" onclick="nextTheme()" aria-label="Changer la couleur"><span class="dot"></span></button></div>
</header>
<div class="quote" id="quote"></div>
<main id="view"></main>
<input id="imp" type="file" accept=".json,application/json" hidden onchange="importData(this)">
<nav>
  <button data-t="meds" onclick="go('meds')"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg></span>Pilules</button>
  <button data-t="rdv" onclick="go('rdv')"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Agenda</button>
  <button data-t="urg" onclick="go('urg')"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18h.01"/></svg></span>Urgence</button>
  <button data-t="fam" onclick="go('fam')"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.7"/><path d="M17.5 14.2a5.5 5.5 0 0 1 4 5.3"/></svg></span>Famille</button>
  <button data-t="vault" onclick="go('vault')"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Papiers</button>
</nav>
<div id="viewer" hidden><img id="vimg" alt=""><button class="big" onclick="closeDoc()">Fermer</button></div>
<div id="hfull" hidden><div id="hfull-body"></div><button class="big wide" onclick="closeHealthFull()">Fermer</button></div>
<div id="alarm" role="alertdialog" aria-live="assertive" hidden>
  <div class="t" id="alarm-head">C’est l’heure de prendre</div>
  <div class="n" id="alarm-name"></div>
  <div class="t" id="alarm-time"></div>
  <button class="yes" id="alarm-yes" onclick="alarmTaken()">J’ai pris</button>
  <button class="later" onclick="alarmLater()">Plus tard (10 min)</button>
</div>
<script>
const KEY="mon-quotidien-v1";
let S={meds:[],taken:{},rdvs:[],contacts:[],family:{},famSent:{},myMeds:[],hid:[],measures:[],health:{},okDay:"",okSent:""};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const dayKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function adherence(days){
  const n=new Date(),tk=dayKey(n),cur=pad(n.getHours())+":"+pad(n.getMinutes());
  let tot=0,ok=0;const per={};
  for(let i=0;i<days;i++){
    const k=shift(tk,-i),wd=parse(k).getDay(),t=S.taken[k]||[];
    for(const m of S.meds){
      if((m.created||tk)>k||!(m.days||ALL).includes(wd))continue;
      if(k===tk&&m.time>cur&&!t.includes(m.id))continue;
      tot++;const p=per[m.name]||(per[m.name]={a:0,b:0});p.b++;
      if(t.includes(m.id)){ok++;p.a++;}
    }
  }
  return {tot,ok,per};
}
function streak(){
  const tk=dayKey(new Date());let c=0;
  for(let i=0;i<60;i++){
    const k=shift(tk,-i),wd=parse(k).getDay(),t=S.taken[k]||[];
    const due=S.meds.filter(m=>(m.created||tk)<=k&&(m.days||ALL).includes(wd));
    if(!due.length)continue;
    if(due.every(m=>t.includes(m.id)))c++;else if(i>0)break;
  }
  return c;
}
function statsCard(){
  if(!S.meds.length)return "";
  const a=adherence(7),pc=a.tot?Math.round(a.ok/a.tot*100):0,sk=streak();
  return `<div class="prog"><div class="pt"><b>Mon suivi sur 7 jours</b></div><div class="pt">${a.tot?pc+" % des prises effectuées ("+a.ok+" sur "+a.tot+")":"Pas encore de prises à compter."}</div><div class="bar"><i style="width:${pc}%"></i></div>${sk>1?'<div class="pt sub" style="margin-top:8px">Série en cours : '+sk+' jours sans oubli</div>':""}<button class="ghost" onclick="shareReport()">Partager mon suivi avec mon médecin</button></div>`;
}
function reportText(){
  const a=adherence(7),L=["Suivi Sérénité, 7 derniers jours","Prises effectuées : "+a.ok+" sur "+a.tot+(a.tot?" ("+Math.round(a.ok/a.tot*100)+" %)":"")];
  for(const n in a.per)L.push("- "+n+" : "+a.per[n].a+" sur "+a.per[n].b);
  const ms=(S.measures||[]).slice(-10);
  if(ms.length){L.push("","Mesures :");for(const m of ms)L.push("- "+m.date+" : "+m.type+" "+m.value+" "+m.unit);}
  L.push("","Ce suivi est un aide-mémoire, il ne remplace pas un avis médical.");
  return L.join("\n");
}
async function shareReport(){
  const txt=reportText();
  try{if(navigator.share){await navigator.share({title:"Mon suivi Sérénité",text:txt});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  try{await navigator.clipboard.writeText(txt);alert("Votre suivi est copié. Vous pouvez le coller dans un message.");}catch(e){prompt("Copiez ce texte :",txt);}
}

function hAge(b){
  if(!b)return "";const d=new Date(b+"T12:00:00");if(isNaN(d))return "";

  if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;

}

function importData(inp){
  const f=inp.files[0];inp.value="";

      if(!confirm("Remplacer les données actuelles par cette sauvegarde ?"))return;
      S=Object.assign({meds:[],taken:{},rdvs:[],contacts:[],family:{},famSent:{},myMeds:[],hid:[],measures:[],health:{},okDay:"",okSent:""},d);

}

function take(id,k){
  k=k||selKey;
  const t=S.taken[k]||[];
  if(!t.includes(id)){t.push(id);const mm=S.meds.find(x=>x.id===id);if(mm&&mm.stock!=null)mm.stock=Math.max(0,mm.stock-1);}
  S.taken[k]=t;for(const x in S.taken)if(x<shift(dayKey(new Date()),-60))delete S.taken[x];justTook=id;setTimeout(()=>{justTook=null},1500);save();render();
}

let ringing=null,beepTimer=null;const snooze={};
function beep(){
  try{
    if(navigator.vibrate)navigator.vibrate([300,150,300]);
    const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.25;
    o.onended=()=>c.close();o.start();o.stop(c.currentTime+.4);
  }catch(e){}
}
function ring(m){
  ringing=m;$("alarm-head").textContent=m.rdv?"Rappel de rendez-vous":"C’est l’heure de prendre";$("alarm-yes").textContent=m.rdv?"OK, merci":"J’ai pris";$("alarm-name").textContent=m.name+(m.dose?" ("+m.dose+")":"");$("alarm-time").textContent=m.rdv?m.when:"prévu à "+m.time;notify(m);
  $("alarm").hidden=false;beep();beepTimer=setInterval(beep,4000);
}
function stopRing(){clearInterval(beepTimer);$("alarm").hidden=true;ringing=null;}
function alarmTaken(){if(ringing.rdv){const r=S.rdvs.find(x=>x.id===ringing.id);if(r){r.done=true;save();}}else take(ringing.id,dayKey(new Date()));stopRing();}
function alarmLater(){snooze[ringing.id]=Date.now()+600000;stopRing();}

function tick(){
  const n=new Date();
  $("date").textContent=n.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  $("clock").textContent=pad(n.getHours())+":"+pad(n.getMinutes());
  $("hi").textContent=n.getHours()<12?"Bonjour":n.getHours()<18?"Bon après-midi":"Bonsoir";
  const dn=Math.floor((n-new Date(n.getFullYear(),0,0))/864e5);
  $("quote").innerHTML='<span class="ql">Citation du jour</span>'+QUOTES[dn%QUOTES.length];
  if(!adding&&!addingMeas&&!editHealth&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))render();
  okCheck(n);
  if(S.family&&S.family.topic){
    const tk=dayKey(n),tt=S.taken[tk]||[];
    for(const m of S.meds){
      if(tt.includes(m.id)||!(m.days||ALL).includes(n.getDay()))continue;
      const k2=tk+":"+m.id,p=m.time.split(":").map(Number),due=new Date(n);
      due.setHours(p[0],p[1],0,0);
      const late=(n-due)/60000;
      if(late>=30&&late<=240&&!S.famSent[k2]&&!famBusy[k2]){
        famBusy[k2]=1;
        famSend((S.family.name||"Votre proche")+" n’a pas pris son médicament de "+m.time+".").then(ok=>{if(ok){S.famSent[k2]=1;save();}famBusy[k2]=0;});
      }
    }
  }
  if(ringing)return;
  for(const r of S.rdvs){
    if(r.done||snooze[r.id]>Date.now())continue;
    const at=new Date(r.date+"T"+r.time).getTime(),st=at-(r.remind||60)*60000;
    if(n.getTime()>=st&&n.getTime()<=at+1800000){ring({id:r.id,rdv:true,name:r.title,when:fmt(r.date)+" à "+r.time});return;}
  }
  const t=S.taken[dayKey(n)]||[];
  for(const m of S.meds){
    if(t.includes(m.id)||!(m.days||ALL).includes(n.getDay()))continue;
    const p=m.time.split(":").map(Number),due=new Date(n);
    due.setHours(p[0],p[1],0,0);
    const late=(n-due)/60000;
    if(late>=0&&late<=60&&!(snooze[m.id]>Date.now())){ring(m);break;}
  }
}
